# O Supabase gratuito pausa o projeto após ~7 dias sem requisições, e o app quase
# não fala com ele (só o multiplayer). Este job chama o banco a cada 3 dias.
# A chave é a anônima, a mesma que já vai dentro do app.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar o banco
        env:
          URL: https://robkeahutptlkgtryvws.supabase.co
          KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvYmtlYWh1dHB0bGtndHJ5dndzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5ODA4NDgsImV4cCI6MjA5MDU1Njg0OH0.QMAWpkQ43itSfFJROMKQ63vmiI4IEWd6x7USpDcKP2E
        # falha visível (e-mail do GitHub) se o projeto já estiver pausado
        run: |
          curl -fsS --retry 3 --retry-delay 10 -X POST "$URL/rest/v1/rpc/limpar_salas_antigas" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
          curl -fsS "$URL/rest/v1/rooms?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"
